# Render Blueprint: a static site (front + the exported JSON under /data). No server, so it
# never sleeps — the free web service took ~1 min to wake up after 15 min idle.
# Redeploys on every push to main. The FastAPI + Docker setup still works for local use.
services:
  - type: web
    name: f1-podium-predictor-site
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # A new deploy must reach visitors at once: never cache the page or the data.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Single-page app: /race/2026/20 etc. load index.html (files that exist are served as-is).
      - type: rewrite
        source: /*
        destination: /index.html
